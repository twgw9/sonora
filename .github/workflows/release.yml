# Sonora sanity check — replaces the default Node.js CI template.
# The template ran `npm ci && npm test`, but this project has zero npm
# dependencies and its full test suite needs jsdom plus a running server,
# so the template could only ever fail. This checks that every JS file
# parses and that the version manifest is valid JSON — quick and green.
name: Sanity check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: All JavaScript parses
        run: |
          for f in app.js server.js start.js sw.js native.js desktop-hooks.js \
                   desktop/main.js desktop/preload.js tests/deep.js tests/room.js \
                   tests/hunt.js tests/platform.js tests/release.js tests/perf.js \
                   tests/stress.js; do
            node --check "$f" || exit 1
          done
          echo "all JS parses"
      - name: version.json is valid
        run: node -e "const v=require('./version.json'); if(!v.version) process.exit(1); console.log('payload v'+v.version)"
      - name: JSON manifests are valid
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package ok')"
