# Builds all three desktop apps on GitHub's own runners and publishes them,
# together with the APK, as a GitHub Release tagged vN where N is the
# version in version.json. This is how the installers get out to users:
# they are 60-90 MB each, far too large for git, so they can only live on
# a Release — and server.js falls back to the latest Release's assets when
# the server has no downloads/ folder of its own.
#
# Triggered automatically whenever version.json changes on main (that is
# the version bump — see UPDATES.md), or manually from the Actions tab
# (workflow_dispatch).
name: Build and Release

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      notes: ${{ steps.read.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          V=$(node -p "require('./version.json').version || 0")
          N=$(node -p "require('./version.json').notes || ''")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "notes=$N" >> "$GITHUB_OUTPUT"
          echo "Sonora v$V"

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build Windows installer
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --win --publish never
      - name: Verify the installer is complete
        shell: pwsh
        run: |
          $f = Get-ChildItem desktop/out/SonoraSetup.exe
          if (-not $f) { throw 'SonoraSetup.exe was not produced' }
          if ($f.Length -lt 5MB) { throw 'SonoraSetup.exe looks truncated (' + $f.Length + ' bytes)' }
          Write-Host "SonoraSetup.exe: $($f.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/out/SonoraSetup.exe
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build macOS app (dmg + zip)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --mac --publish never
      - name: Verify the zip exists
        shell: bash
        run: |
          ls -lh out/*.dmg out/*.zip || { echo "no macOS artifacts"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error

  linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build Linux AppImage and deb
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --linux --publish never
      - name: Verify artifacts exist
        shell: bash
        run: |
          ls -lh out/*.AppImage out/*.deb || { echo "no linux artifacts"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: |
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error

  release:
    needs: [meta, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble release files
        shell: bash
        run: |
          mkdir -p dist
          cp apk/Sonora.apk dist/ || true
          ls -lh dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Sonora v${{ needs.meta.outputs.version }}
          body: ${{ needs.meta.outputs.notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: dist/*
