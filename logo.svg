<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ff3f"/><stop offset="1" stop-color="#7ef29d"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#lg)" stroke-width="3" opacity=".28"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#lg)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="70 260" filter="url(#gl)">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#gl)">
    <rect x="34" y="52" width="7" height="16" rx="3.5" fill="url(#lg)">
      <animate attributeName="height" values="16;38;16" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="52;41;52" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="47" y="40" width="7" height="40" rx="3.5" fill="url(#lg)">
      <animate attributeName="height" values="40;18;40" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;51;40" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="34" width="7" height="52" rx="3.5" fill="url(#lg)">
      <animate attributeName="height" values="52;26;52" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="34;47;34" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="73" y="44" width="7" height="32" rx="3.5" fill="url(#lg)">
      <animate attributeName="height" values="32;46;32" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="44;37;44" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
